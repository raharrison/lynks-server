name: Release

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        run: grep -qx "version = \"${GITHUB_REF_NAME}\"" build.gradle.kts
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace build shadowJar
      - name: Copy artifact to remote server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          strip_components: 2
          source: "build/libs/lynks-server-${{ github.ref_name }}-all.jar"
          target: ${{ secrets.API_TARGET_PATH }}
