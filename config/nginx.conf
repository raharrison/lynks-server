# Site config for the VPS nginx, e.g. /etc/nginx/sites-available/lynks.
# Serves the built UI straight off disk and proxies the API to the systemd
# service on localhost. TLS is left to whatever already terminates it.

# Password login has no rate limit of its own, so it is limited per client here
limit_req_zone $binary_remote_addr zone=lynks_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lynks.example.com;

    # drop the lynks-ui dist/ here
    root /var/www/lynks;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/plain text/xml application/xml;

    # Vite emits content-hashed filenames
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/login {
        limit_req zone=lynks_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 500M;
        proxy_read_timeout 120s;
    }
}

