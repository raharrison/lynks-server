services:
  lynks-ui:
    image: raharrison/lynks-ui:1.2.3
    restart: on-failure:5
  lynks-server:
    image: raharrison/lynks-server:1.4.1
    env_file:
      - ./config/.env
    environment:
      - JAVA_OPTS=-DCONFIG_MODE=prod
      - external_scraperHost=http://lynks-scraper:3000/api
      - database_user=${POSTGRES_USER:-lynksuser}
      - database_password=${POSTGRES_PASSWORD}
      - database_url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lynksdb}
    volumes:
      - ./media:/app/media
      - ./config:/app/config
    user: "${CURRENT_UID:?Set CURRENT_UID before running compose}:${CURRENT_GUID:?Set CURRENT_GUID before running compose}"
    init: true
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
  lynks-scraper:
    image: raharrison/lynks-scraper:1.1.0
    init: true
    restart: on-failure:5
    volumes:
      - ./media:/app/media
    user: "${CURRENT_UID:?Set CURRENT_UID before running compose}:${CURRENT_GUID:?Set CURRENT_GUID before running compose}"
    shm_size: 2gb
    security_opt:
      - seccomp=unconfined
  lynks-gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: on-failure:5
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - lynks-ui
      - lynks-server
  postgres:
    image: postgres:18-trixie
    volumes:
      - lynks-data:/var/lib/postgresql/data
    restart: on-failure:5
    env_file:
      - ./config/.env
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lynksuser} -d ${POSTGRES_DB:-lynksdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lynks-data:
